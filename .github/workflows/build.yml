name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Re-run just the Store submission for an existing release (e.g. after
  # a Partner Center or tooling failure)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to the Store (e.g. v2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tinta v${{ steps.version.outputs.VERSION }}
          body: |
            ## Tinta v${{ steps.version.outputs.VERSION }}

            ### Installation
            - Easiest: `winget install "Tinta Markdown Viewer" -s msstore` (Store-signed, no security prompts, auto-updates), or the [Microsoft Store page](https://apps.microsoft.com/detail/9MZ5MZ3L9RKF)
            - Portable: download `tinta.exe` below and run it (SmartScreen may ask: "More info", then "Run anyway")
            - Optionally run `tinta.exe /register` to register Markdown, Mermaid and PlantUML files

            ### Go to line (#276)
            - Ctrl+G opens a prompt at the top of the editor or the reading view: type a line number and press Enter. The editor puts the caret at the start of the line; the reading view scrolls to where it is drawn (#276)
            - Requested by @derek-price (#276)

            ### Russian interface (#274)
            - The interface is available in Russian, chosen automatically on Russian Windows or in Settings → General → Language (#274)
            - Contributed by @NorthMause (#274)

            ### Keep deleted files in memory (#275)
            - An opt-in setting in Settings → General keeps a deleted file's last content readable and editable in its tab until the tab or Tinta closes; saving it asks for a place with Save As (#275)
            - Contributed by @NorthMause (#275)

            ### Notifications and tabs (#272, #273)
            - Settings → Appearance → Show notifications turns off the messages that go away on their own: copy confirmations, "Saved", status messages and the edit-mode hints. Warnings, errors and messages that need an answer still show (#273)
            - The mouse wheel over the tab strip switches to the previous or next tab, wrapping at both ends; Ctrl+wheel still zooms (#272)
            - Requested by @megayu (#272, #273)

            ### Inline code without a box (#278)
            - `inlinecodebackground=` in `themes.ini` sets the box behind inline code: `none` drops it, a colour gives it its own. Code blocks keep `codebackground`, and the HTML and Word exports and printing follow it (#278)
            - Requested by @Knewhenry (#278)

            ### Fixed
            - Mermaid flowchart labels in double quotes can run over several lines; such a diagram showed its source before. Quotes around edge text no longer show in the label, and a long one-word edge label stays on one line. Reported by @derek-price (#281)
            - Beside the preview, the editor's scrollbar shows the arrow pointer, and the preview's scrollbar can be dragged, moving both panes. Reported by @a86022 (#280)
            - A document left for a new note, the start page or an untitled tab, or reopened after its last tab closed, comes back where it was read instead of at an older place. Reported by @aweib888 (#279)
            - A single `~` between digits or Chinese, Japanese or Korean characters, as in `50~100mm`, reads as a range instead of starting a subscript. Reported by @aweib888 (#277)
            - In files with Windows (CRLF) line endings, E opens the editor at the reading position instead of above it. Reported by @derek-price (#267)
            - Opening Help no longer centres the text of the contents panel, the search results and the tab card. Reported by @megayu (#270)
            - The first and last tabs show the active tab's halo on both sides. Reported by @megayu (#271)

            ### What's included
            - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
            - 22 natively rendered Mermaid diagram families, and PlantUML diagrams through a local PlantUML
            - Tabbed interface with drag, session restore, and a tab context menu
            - 10 tuned themes (5 light, 5 dark) plus custom themes
            - Hardware-accelerated rendering via Direct2D
            - Single portable executable about 2.5 MB, no dependencies
          files: build/Release/tinta.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the release to the Microsoft Store (app 9MZ5MZ3L9RKF).
  # Skips itself until the MSSTORE_* secrets are configured — see packaging/msix/README notes.
  store:
    runs-on: windows-latest
    needs: build
    # Runs after a successful tag build, or standalone via workflow_dispatch
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}

    steps:
      - name: Check Store credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$MSSTORE_CLIENT_SECRET" ]; then
            echo "on=true" >> $GITHUB_OUTPUT
          else
            echo "on=false" >> $GITHUB_OUTPUT
            echo "MSSTORE_* secrets not set - skipping Store publish."
          fi

      - name: Checkout code
        if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Download release asset
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\Release | Out-Null
          gh release download $env:RELEASE_TAG --pattern tinta.exe --output build\Release\tinta.exe --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MSIX
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: pwsh -File packaging/msix/pack.ps1 -ExePath build/Release/tinta.exe

      - name: Setup Microsoft Store CLI
        if: steps.gate.outputs.on == 'true'
        uses: microsoft/setup-msstore-cli@v1
        with:
          # v0.4.0 (2026-08-18, .NET 10/native-AOT rework) fails uploads at
          # 34% consistently; pin the last known-good release
          version: "v0.3.9"

      - name: Configure Store CLI
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET

      - name: Publish to Microsoft Store
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem packaging/msix/out/tinta-*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId 9MZ5MZ3L9RKF
